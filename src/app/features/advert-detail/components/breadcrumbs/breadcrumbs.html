<nav class="breadcrumb">
    @for (item of breadcrumbs(); track item.id; let last = $last) {
    <a class="breadcrumb-link" [routerLink]="['/search']" [queryParams]="{c: item.id}">{{ item.name }}</a>
    @if (!last) {
    <svg width="4" height="4" viewBox="0 0 4 4" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="2" cy="2" r="2" fill="#64748B" />
    </svg>

    }
    }
</nav>
